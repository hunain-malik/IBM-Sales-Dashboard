name: Recover shared data from a previous store

# Manual-only: merges records into the current data store (union by record
# id; the current store's copy wins on any clash). Source is either a previous
# store's URL, or — when left blank — the repo's committed backup snapshot
# (server/data-backup.json, written by the backup-data workflow).
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Previous store URL to copy from (leave blank to restore from the committed backup)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy records into the current store
        run: |
          set -euo pipefail
          SRC='${{ github.event.inputs.source_url }}'
          DST=$(cat server/shared-blob-url.txt)
          if [ -n "$SRC" ]; then
            echo "source: $SRC"
            src=$(curl -sf "$SRC") || { echo "::error::source store is not answering — nothing to recover"; exit 1; }
          else
            echo "source: committed backup (server/data-backup.json)"
            [ -f server/data-backup.json ] || { echo "::error::no committed backup exists yet"; exit 1; }
            src=$(cat server/data-backup.json)
          fi
          echo "target: $DST"
          dst=$(curl -sf "$DST")
          echo "source contents: $(echo "$src" | jq -c '{version, sessions: (.enablements | length), deals: (.deals | length)}')"
          echo "target before:   $(echo "$dst" | jq -c '{version, sessions: (.enablements | length), deals: (.deals | length)}')"
          merged=$(jq -n --argjson a "$src" --argjson b "$dst" '{
            version: (($b.version // 0) + 1),
            enablements: ((($b.enablements // []) + ($a.enablements // [])) | unique_by(.id)),
            deals: ((($b.deals // []) + ($a.deals // [])) | unique_by(.id))
          }')
          curl -sf -X PUT "$DST" -H 'Content-Type: application/json' -d "$merged" > /dev/null
          echo "target after:    $(echo "$merged" | jq -c '{version, sessions: (.enablements | length), deals: (.deals | length)}')"
