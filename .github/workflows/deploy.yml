name: Build, deploy and release the dashboard

on:
  push:
    branches: [claude/determined-turing-d1ieij]
  workflow_dispatch:

# Push the built site to the `site` branch and create the release.
permissions:
  contents: write

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Publish the static build to a `site` branch. No GitHub Pages / domain /
      # settings needed: raw.githack.com serves those public files as a live page.
      - name: Publish build to the site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -b site
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "Deploy dashboard build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site

      - name: Publish release with live dashboard link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          url="https://raw.githack.com/${GITHUB_REPOSITORY}/site/index.html"
          notes=$(cat <<EOF
          ## 🚀 Live dashboard

          ### ▶ [Open the Enablement Impact Dashboard]($url)

          The link above opens the running dashboard live in your browser — no install, no login.

          **What's inside**
          - **Impact summary** (landing) — KPIs, influenced-vs-not comparison with a data-generated verdict, where-to-invest view, monthly influenced pipeline, and the influence timeline
          - **Enablements** — month calendar + table; click any day to log a session
          - **Pipeline** — add and edit deals with automatic "Influenced" tagging
          - **Executive one-pager** — print/PDF summary whose headline and recommended actions adapt to the data

          v1 data is manual input, stored in your browser (localStorage) and seeded with a demo dataset.
          Toggle the IBM dark theme with the moon/sun icon; reset the demo data with the refresh icon.

          _Built from \`${GITHUB_SHA}\`. The link always serves the latest build on the \`site\` branch._
          EOF
          )
          # Recreate the tag/release each run so the link always points at the latest build.
          gh release delete v0.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.1.0 \
            --title "Enablement Impact Dashboard v0.1.0" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
          echo "Release published, dashboard at: $url"
