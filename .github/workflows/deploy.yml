name: Build, deploy and release the dashboard

on:
  push:
    branches: [claude/determined-turing-d1ieij]
  workflow_dispatch:

# Push the built site to the `site` branch and create the release.
permissions:
  contents: write

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The deployed site uses a shared JSON-document store so everyone with
      # the link sees the same live data: one document URL where GET returns
      # {version, enablements, deals} and PUT replaces it. The URL lives in
      # server/shared-blob-url.txt (today: a Firebase Realtime Database REST
      # path — see server/README-store.md) and every deploy reuses it so the
      # data survives redeployments.
      - name: Ensure the shared data store exists
        run: |
          set -euo pipefail
          FILE=server/shared-blob-url.txt
          url=""
          [ -f "$FILE" ] && url=$(cat "$FILE")
          # An EMPTIED url file is a deliberate rotation request: a fresh store
          # is created below (pair it with a RECOVER_FROM.txt marker holding
          # "backup" to seed it from the committed snapshot).
          if [ -n "$url" ]; then
            # retry transient failures; NEVER silently rotate an existing store —
            # a fresh empty store orphans the team's live data. Fail loudly and
            # let a human decide (the recover-data workflow can merge stores).
            code=000
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo 000)
              [ "$code" = "200" ] && break
              echo "data store check attempt $attempt failed (HTTP $code), retrying…"
              sleep 15
            done
            if [ "$code" != "200" ]; then
              echo "::error::The shared data store is not answering (HTTP $code): $url"
              echo "::error::Refusing to create a replacement automatically — that would orphan the team's data."
              echo "::error::Re-run this deploy once the store answers, or rotate it deliberately and run the 'Recover shared data' workflow."
              exit 1
            fi
          fi
          if [ -z "$url" ]; then
            # No auto-creation: the anonymous-store era (jsonblob) died twice.
            # The store is now a document URL someone owns (Firebase Realtime
            # Database REST path, e.g. https://<project>.firebaseio.com/outbound.json)
            # committed to $FILE by hand.
            echo "::error::No shared data store is configured."
            echo "::error::Put the store's document URL in $FILE and push (see server/README-store.md)."
            exit 1
          fi
          echo "BLOB_URL=$url" >> "$GITHUB_ENV"
          echo "shared data store: $url"

      # One-time recovery: while server/RECOVER_FROM.txt exists, merge that
      # source's records into the current store (union by id, current store
      # wins clashes), then delete the marker so this never re-runs — a
      # re-merge could resurrect records the team deliberately wiped. The
      # marker holds either a previous store's URL, or the literal word
      # "backup" to restore from the committed snapshot (server/data-backup.json)
      # — the path used when the previous store is already dead.
      - name: One-time data recovery
        run: |
          set -euo pipefail
          MARKER=server/RECOVER_FROM.txt
          [ -f "$MARKER" ] || { echo "no recovery pending"; exit 0; }
          SRC=$(cat "$MARKER")
          DST=$(cat server/shared-blob-url.txt)
          if [ "$SRC" = "backup" ]; then
            src=$(cat server/data-backup.json)
            echo "recovering from the committed backup snapshot"
          else
            src=$(curl -sf "$SRC") || src=""
          fi
          if [ -n "$src" ]; then
            dst=$(curl -sf "$DST")
            merged=$(jq -n --argjson a "$src" --argjson b "$dst" '{
              version: (($b.version // 0) + 1),
              enablements: ((($b.enablements // []) + ($a.enablements // [])) | unique_by(.id)),
              deals: ((($b.deals // []) + ($a.deals // [])) | unique_by(.id))
            }')
            curl -sf -X PUT "$DST" -H 'Content-Type: application/json' -d "$merged" > /dev/null
            echo "RECOVERED into current store: $(echo "$merged" | jq -c '{sessions: (.enablements | length), deals: (.deals | length)}')"
          else
            echo "::warning::previous store did not answer — nothing could be recovered"
          fi
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git rm -q "$MARKER"
          git commit -m "Recovery attempt finished — disarm marker [skip ci]"
          git push

      - name: Build
        # VITE_BUILD_SHA lets a deployed copy recognize when a newer build
        # exists and point visitors of stale sha-pinned links at the fresh one
        run: VITE_API_URL="$BLOB_URL" VITE_API_KIND=blob VITE_BUILD_SHA="$GITHUB_SHA" VITE_REPO="$GITHUB_REPOSITORY" npm run build

      # Publish the static build to a `site` branch. No GitHub Pages / domain /
      # settings needed: raw.githack.com serves those public files as a live page.
      - name: Publish build to the site branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          git init -q
          git checkout -q -b site
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -qm "Deploy dashboard build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          # the release link pins this exact build commit, so the CDN can never
          # serve a stale page for it
          echo "SITE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish release with live dashboard link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The URL embeds the immutable site-branch commit sha, so every deploy
          # yields a never-seen-before URL — the CDN cannot serve stale content
          # (a ?v= query string turned out not to bust githack's cache reliably).
          url="https://rawcdn.githack.com/${GITHUB_REPOSITORY}/${SITE_SHA}/index.html"
          notes=$(cat <<EOF
          ## 🚀 Live dashboard

          ### ▶ [Open the Outbound Pipeline View]($url)

          The link above opens the running dashboard live in your browser — no install, no login.

          **What's inside**
          - **Pipeline View** (landing) — KPIs, outbound-touched vs. untouched deal comparison, demand-vs-coverage view, quarterly outbound-touched pipeline, and the outbound-touched deals list
          - **Enablements** — sessions list + month calendar; click any day to log one
          - **Deals** — add and edit deals with automatic "Outbound touched" tagging, plus the session-to-deal timeline
          - **Executive one-pager** — print/PDF summary whose headline and recommended actions adapt to the data

          Data is **shared and persistent**: every entry saves to a common store, and everyone opening
          this link sees the same live records — the header shows the sync status (Saved / Saving… /
          Offline). The store starts empty; log the first session or deal to begin.
          Toggle the IBM dark theme with the moon/sun icon.

          _Built from \`${GITHUB_SHA}\`._
          EOF
          )
          # Edit the release in place — never delete it, so the release page
          # has no window where it doesn't exist.
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release edit v0.1.0 --title "Outbound Pipeline View v0.1.0" --notes "$notes"
          else
            gh release create v0.1.0 \
              --title "Outbound Pipeline View v0.1.0" \
              --notes "$notes" \
              --target "$GITHUB_SHA"
          fi
          echo "Release updated, dashboard at: $url"
