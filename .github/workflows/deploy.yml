name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/determined-turing-d1ieij]
  workflow_dispatch:

# Allow the workflow to publish Pages and create a release with the live link.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages (auto-enable if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Publish release with live dashboard link
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          ## 🚀 Live dashboard

          **[▶ Open the Enablement Impact Dashboard]($PAGE_URL)**

          The link above opens the running dashboard (hosted on GitHub Pages).

          ### What's inside
          - **Overview** — impact KPIs, influenced revenue by use case, cumulative influenced revenue
          - **Enablements** — month calendar + table; click any day to log a session
          - **Pipeline** — manual deal entry with automatic "Influenced" tagging
          - **Impact summary** — Sankey flow from enablement session → use case → customer deal

          v1 data is manual input, stored in your browser (localStorage) and seeded with a demo dataset.
          Use the moon/sun icon to toggle the IBM dark theme and the refresh icon to reset the demo data.

          _Deployed from \`${GITHUB_SHA}\`._
          EOF
          )
          # Recreate the tag/release each run so the link always points at the latest build.
          gh release delete v0.1.0 --yes --cleanup-tag 2>/dev/null || true
          gh release create v0.1.0 \
            --title "Enablement Impact Dashboard v0.1.0" \
            --notes "$notes" \
            --target "$GITHUB_SHA"
          echo "Release published: $PAGE_URL"
